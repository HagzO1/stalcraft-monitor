name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type: debug or release'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-dev python3-pip \
            build-essential git autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev \
            cmake libffi-dev \
            libssl-dev libltdl-dev \
            openjdk-17-jdk unzip

      - name: Install buildozer
        run: pip install --upgrade pip setuptools wheel cython 'buildozer==1.5.0'

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build with buildozer (debug)
        env:
          AIOHTTP_NO_EXTENSIONS: 1
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          yes | buildozer android debug

      - name: Upload unsigned debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stalcraft-monitor-unsigned-debug
          path: bin/*
